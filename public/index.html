<!DOCTYPE html>
<html lang="en" class="theme-transition">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/images/logo/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Lurnix</title>

    <!-- Preload font (اختياري لتحسين الأداء) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" />
  </head>
  <body class="theme-transition">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Script مهم جدًا: يحدد الثيم قبل ما React يتحمل (يمنع Flash of Wrong Theme) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme') || 'light';
          const root = document.documentElement;
          
          // تطبيق الثيم فورًا
          if (savedTheme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          // إضافة class للترانزيشن النظيف
          root.classList.add('theme-transition');
          
          // تعطيل الترانزيشن مؤقتًا أثناء التحميل الأولي
          root.classList.add('disable-transitions');
          
          // إعادة تفعيل الترانزيشن بعد التحميل
          window.addEventListener('load', () => {
            setTimeout(() => {
              root.classList.remove('disable-transitions');
            }, 50);
          });

        } catch (e) {
          console.warn('Theme initialization failed', e);
        }
      })();
    </script>
  </body>
</html>
